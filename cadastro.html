<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instituto Raiz Comunitária | Cadastro</title>
  <meta name="description" content="Cadastre-se como voluntário ou doador do Instituto Raiz Comunitária.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div>
      <a href="index.html">Instituto Raiz Comunitária</a>
      <nav aria-label="Navegação principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="projetos.html">Projetos</a></li>
          <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <section aria-labelledby="intro-cadastro-titulo">
      <h1 id="intro-cadastro-titulo">Faça parte da nossa rede</h1>
      <p>Preencha o formulário abaixo para se cadastrar como voluntário ou apoiador.</p>
    </section>

    <section aria-labelledby="form-titulo">
      <h2 id="form-titulo">Formulário de cadastro</h2>

      <form id="form-cadastro">

        <fieldset>
          <legend>Dados pessoais</legend>

          <div>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required minlength="5" autocomplete="name">
          </div>

          <div>
            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>
          </div>

          <div>
            <label for="cpf">CPF</label>
            <input
              type="text"
              id="cpf"
              name="cpf"
              required
              inputmode="numeric"
              maxlength="14"
              placeholder="000.000.000-00"
              pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
              title="Digite o CPF no formato 000.000.000-00"
            >
          </div>

          <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>

          <div>
            <label for="telefone">Telefone</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              required
              inputmode="numeric"
              maxlength="15"
              placeholder="(00) 00000-0000"
              pattern="\(\d{2}\)\s\d{4,5}-\d{4}"
              title="Digite o telefone no formato (00) 00000-0000"
            >
          </div>
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>

          <div>
            <label for="cep">CEP</label>
            <input
              type="text"
              id="cep"
              name="cep"
              required
              inputmode="numeric"
              maxlength="9"
              placeholder="00000-000"
              pattern="\d{5}-\d{3}"
              title="Digite o CEP no formato 00000-000"
            >
          </div>

          <div>
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" required autocomplete="address-line1">
          </div>

          <div>
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" required autocomplete="address-level2">
          </div>

          <div>
            <label for="estado">Estado</label>
            <select id="estado" name="estado" required>
              <option value="">Selecione</option>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>
            </select>
          </div>
        </fieldset>

        <fieldset>
          <legend>Envolvimento</legend>

          <div>
            <label for="interesse">Área de interesse</label>
            <select id="interesse" name="interesse" required>
              <option value="">Selecione</option>
              <option value="educacao">Educação infantil</option>
              <option value="capacitacao">Capacitação profissional</option>
              <option value="cultura">Resgate cultural</option>
              <option value="doacao">Somente doação</option>
            </select>
          </div>

          <div>
            <label for="mensagem">Mensagem (opcional)</label>
            <textarea id="mensagem" name="mensagem" rows="4"></textarea>
          </div>

          <div>
            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Li e aceito os termos de uso e a política de privacidade</label>
          </div>
        </fieldset>

        <button type="submit">Enviar cadastro</button>

      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Instituto Raiz Comunitária. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
